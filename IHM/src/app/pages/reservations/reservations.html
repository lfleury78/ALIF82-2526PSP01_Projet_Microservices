<div id="detail-reservations" class="d-block">
    <div class="reservations-header">
            <p class="hessbnb-reservations">RESERVATIONS</p>
            <p class="reservations-title">Quels seront vos prochains voyages</p>
        </div>
    <div class="list-group py-4">
        @for (reservation of this.reservations; track reservation.name) {
            <a href="location" class="list-group-item list-group-item-action flex-column align-items-start">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1">{{ reservation.name }}</h5>
                    <small>{{ reservation.dateBegin }} - {{ reservation.dateEnd }}</small>
                </div>
                <small class="mb-1">{{ reservation.city }}, {{ reservation.country }}</small>
            </a>
        } @empty {
            <li>There are no items.</li>
        }
    </div>
</div>
