spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hessbnb?currentSchema=review_schema
    username: hessbnb
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: review_schema
    open-in-view: false
  flyway:
    enabled: true
    schemas: review_schema
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/hessbnb

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/hessbnb?currentSchema=review_schema
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/hessbnb/protocol/openid-connect/certs
